<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f16">
<title>Song Arena — your Top 10 of all time</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#0d0f16; --surface:#161925; --surface2:#1e2232; --ink:#f4f5fa; --muted:#9aa1b8; --line:#272c3d; --soft:#232838;
  --accent:#ff4d6d; --accent-ink:#ffffff; --teal:#35d1c5; --gold:#f5c451; --focus:#8fb3ff;
  color-scheme:dark; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif; font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button{ font:inherit; color:inherit; }
button:focus-visible,a:focus-visible,input:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
img{ max-width:100%; }

/* header */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:rgba(13,15,22,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.top-in{ max-width:960px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.brand{ font-weight:800; font-size:18px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }
.brand i{ width:16px; height:16px; border-radius:50%; background:conic-gradient(from 20deg,var(--accent),#ff9a62,var(--accent)); display:inline-block; box-shadow:inset 0 0 0 5px var(--bg); }
.steps{ display:flex; gap:2px; margin-left:auto; }
.step{ border:0; background:transparent; padding:7px 10px; border-radius:999px; font-weight:600; color:var(--muted); cursor:pointer; font-size:14px; }
.step[aria-current="step"]{ background:var(--ink); color:var(--bg); }
.step:disabled{ opacity:.35; cursor:not-allowed; }
.ghost{ border:1px solid var(--line); background:transparent; padding:7px 12px; border-radius:999px; cursor:pointer; font-weight:500; color:var(--muted); }
.ghost:hover{ color:var(--ink); border-color:var(--muted); }
@media (max-width:640px){ .steps{ width:100%; order:3; margin-left:0; } .step{ flex:1; text-align:center; padding:7px 2px; font-size:12px; } }

/* layout */
.wrap{ max-width:960px; margin:0 auto; padding:22px 16px 90px; }
h1{ font-size:clamp(28px,6vw,44px); font-weight:800; letter-spacing:-.025em; line-height:1.02; margin:0 0 8px; }
h2{ font-size:19px; font-weight:800; letter-spacing:-.01em; margin:26px 0 8px; }
.lede{ color:var(--muted); font-size:16px; max-width:62ch; margin:0 0 14px; }
.lede b{ color:var(--ink); font-weight:600; }
.meta{ color:var(--muted); font-size:14px; }
.comp{ font-size:12px; color:var(--muted); margin-top:6px; }
.stat{ display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
.stat b{ color:var(--ink); font-weight:700; }
.bar{ height:6px; border-radius:999px; background:var(--soft); overflow:hidden; margin:10px 0 6px; }
.bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),#ff9a62); border-radius:999px; transition:width .25s; }
.bar.teal i{ background:linear-gradient(90deg,var(--teal),#7cf0e6); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; }
.notice{ background:var(--soft); border-radius:12px; padding:12px 14px; font-size:14px; margin-top:12px; }
.notice.err{ background:rgba(255,77,109,.14); }
.loading{ color:var(--muted); font-size:14px; display:flex; align-items:center; gap:8px; margin-top:10px; }
.spin{ width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--teal); border-radius:50%; animation:sp .8s linear infinite; flex:none; }
@keyframes sp{ to{ transform:rotate(360deg);} }
.empty{ padding:36px 24px; text-align:center; color:var(--muted); }
kbd{ font:inherit; font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; background:var(--soft); }
.hint{ color:var(--muted); font-size:13px; margin-top:12px; }

/* chips & buttons */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; }
.chip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 15px; cursor:pointer; font-weight:600; font-size:15px; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:transparent; }
.chip.more{ border-style:dashed; color:var(--muted); font-weight:500; }
.chip b{ font-weight:700; }
.btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:14px 14px; border-radius:16px; font-weight:700; cursor:pointer; font-size:16px; }
.btn small{ display:block; font-weight:500; color:var(--muted); font-size:12px; margin-top:2px; }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.primary small{ color:rgba(255,255,255,.85); }
.btn.wide{ width:100%; margin-top:12px; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn:active:not(:disabled){ transform:translateY(1px); }
.btnrow{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
.row-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; }
.link{ background:none; border:0; padding:6px 2px; color:var(--muted); text-decoration:underline; cursor:pointer; font-weight:500; }
.link:hover{ color:var(--ink); }
.pill{ border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--surface); cursor:pointer; font-size:14px; font-weight:600; }
.pill[data-on="1"]{ background:var(--accent); color:#fff; border-color:transparent; }
.tag{ display:inline-block; background:var(--soft); border-radius:999px; padding:4px 10px; font-size:14px; margin:4px 6px 0 0; }
.tag b{ font-weight:700; }

/* artist tiles */
.glabel{ font-size:13px; color:var(--muted); margin:16px 0 6px; font-weight:700; letter-spacing:.01em; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; }
.tile{ border:0; background:transparent; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
.tile .ph{ width:76px; height:76px; border-radius:50%; overflow:hidden; display:grid; place-items:center; font-weight:800; font-size:22px; color:#fff; background:linear-gradient(135deg,#3a3f5a,#20233a); box-shadow:0 0 0 2px transparent; transition:box-shadow .12s, transform .12s; position:relative; }
.tile .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
.tile .tn{ font-size:13px; font-weight:600; line-height:1.15; color:var(--ink); max-width:100px; overflow-wrap:anywhere; }
.tile[aria-pressed="true"] .ph{ box-shadow:0 0 0 3px var(--accent); transform:scale(1.04); }
.tile[aria-pressed="true"] .ph::after{ content:"✓"; position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-size:14px; display:grid; place-items:center; box-shadow:0 0 0 3px var(--bg); }

/* song cards: art first */
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
@media (min-width:560px){ .grid{ grid-template-columns:repeat(3,1fr);} }
@media (min-width:820px){ .grid{ grid-template-columns:repeat(4,1fr);} }
.sc{ position:relative; border-radius:16px; overflow:hidden; cursor:pointer; background:var(--surface2); aspect-ratio:1; box-shadow:0 0 0 2px transparent; transition:box-shadow .12s, transform .12s; }
.sc img{ width:100%; height:100%; object-fit:cover; display:block; }
.sc .noart{ width:100%; height:100%; background:linear-gradient(135deg,#3a3f5a,#20233a); }
.sc-body{ position:absolute; inset:auto 0 0 0; padding:38px 10px 10px; background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%); color:#fff; }
.sc-t{ font-weight:800; font-size:15px; line-height:1.15; letter-spacing:-.01em; overflow-wrap:anywhere; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.sc-a{ color:rgba(255,255,255,.78); font-size:12px; margin-top:2px; overflow-wrap:anywhere; }
.sc[data-loved="1"]{ box-shadow:0 0 0 3px var(--accent); transform:scale(.985); }
.play{ width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; cursor:pointer; font-size:14px; display:grid; place-items:center; flex:none; backdrop-filter:blur(6px); }
.play[data-on="1"]{ background:var(--teal); color:#0d0f16; }
.play:disabled{ opacity:.3; cursor:default; }
.sc .play{ position:absolute; left:8px; top:8px; }
.heart{ position:absolute; right:8px; top:8px; width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.5); color:rgba(255,255,255,.9); font-size:19px; cursor:pointer; display:grid; place-items:center; backdrop-filter:blur(6px); }
.sc[data-loved="1"] .heart{ background:var(--accent); color:#fff; }
.thumb{ width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--surface2); display:block; }

/* search */
.searchbar{ display:flex; gap:8px; margin-top:10px; }
.searchbar input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; padding:13px 14px; font:inherit; background:var(--surface); color:var(--ink); }
.results{ list-style:none; padding:0; margin:8px 0 0; }
.results li{ display:grid; grid-template-columns:52px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.t{ font-weight:700; font-size:16px; letter-spacing:-.01em; overflow-wrap:anywhere; }
.a{ color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
.side-foot{ display:flex; gap:8px; align-items:center; justify-content:center; }

/* duel */
.duel{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; align-items:start; position:relative; }
.duel .vs{ position:absolute; left:50%; top:calc(50% - 22px); transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%; background:var(--bg); border:2px solid var(--line); display:grid; place-items:center; font-weight:800; font-size:14px; z-index:2; }
.duel-card{ border:0; padding:0; background:transparent; width:100%; cursor:pointer; text-align:left; }
.duel-card .art{ position:relative; border-radius:18px; overflow:hidden; aspect-ratio:1; background:var(--surface2); box-shadow:0 0 0 2px transparent; transition:transform .12s, box-shadow .12s; }
.duel-card .art img{ width:100%; height:100%; object-fit:cover; display:block; }
.duel-card:hover .art{ transform:scale(1.015); box-shadow:0 0 0 3px var(--accent); }
.duel-card .rec{ position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); color:#fff; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:700; backdrop-filter:blur(6px); }
.duel-card .song-title{ font-size:clamp(16px,3.6vw,22px); font-weight:800; letter-spacing:-.015em; line-height:1.1; margin:10px 0 0; overflow-wrap:anywhere; }
.duel-card .song-artist{ font-size:14px; color:var(--muted); margin:3px 0 0; }
.side{ display:flex; flex-direction:column; gap:8px; }
.alive{ font-size:13px; color:var(--muted); }

/* list */
.rows{ list-style:none; padding:0; margin:12px 0 0; }
.row{ display:grid; grid-template-columns:34px 52px 1fr auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
.row .rank{ font-weight:800; font-size:20px; color:var(--muted); text-align:right; letter-spacing:-.02em; }
.row.r1 .rank{ color:var(--gold); } .row.r2 .rank,.row.r3 .rank{ color:var(--ink); }
.row.topten .t{ font-size:17px; }
.row.bench{ opacity:.72; } .row.bench .rank{ font-size:14px; } .row.bench .thumb{ width:40px; height:40px; }
.row.bench{ grid-template-columns:34px 40px 1fr auto; }
.arrows{ display:flex; gap:4px; }
.arrows button{ border:1px solid var(--line); background:var(--surface); border-radius:8px; width:30px; height:30px; cursor:pointer; color:var(--muted); }
.arrows button:hover{ color:var(--ink); border-color:var(--muted); }
.podium{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.podium .p{ position:relative; border-radius:16px; overflow:hidden; aspect-ratio:1; background:var(--surface2); }
.podium .p img{ width:100%; height:100%; object-fit:cover; display:block; }
.podium .p .n{ position:absolute; left:8px; top:8px; width:28px; height:28px; border-radius:50%; background:var(--gold); color:#1a1300; font-weight:800; display:grid; place-items:center; font-size:14px; }
.podium .p.p2 .n{ background:#d8dbe6; } .podium .p.p3 .n{ background:#d9a66c; }
.podium .p .cap{ position:absolute; inset:auto 0 0 0; padding:28px 8px 8px; background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85)); color:#fff; font-size:12px; font-weight:700; line-height:1.15; }
.podium .p .cap span{ display:block; font-weight:500; color:rgba(255,255,255,.75); font-size:11px; }
textarea.export{ width:100%; min-height:150px; margin-top:10px; border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; font-size:14px; background:var(--surface); color:var(--ink); }
#toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .15s,transform .15s; z-index:20; max-width:90vw; text-align:center; }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
/* swipe deck */
.deck{ position:relative; width:min(92vw,420px); aspect-ratio:1/1.28; margin:14px auto 0; }
.swipecard{ position:absolute; inset:0; border-radius:22px; overflow:hidden; background:var(--surface2); box-shadow:0 18px 40px rgba(0,0,0,.45); user-select:none; -webkit-user-select:none; touch-action:none; will-change:transform; }
.swipecard img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.swipecard .noart{ width:100%; height:100%; background:linear-gradient(135deg,#3a3f5a,#20233a); }
.swipecard.under{ transform:scale(.95) translateY(14px); opacity:.6; }
.swipecard .sc-body{ padding:60px 16px 16px; }
.swipecard .sc-t{ font-size:22px; }
.swipecard .sc-a{ font-size:14px; }
.swipecard .why{ margin-top:8px; display:inline-block; font-size:12px; font-weight:600; color:#fff; background:rgba(255,255,255,.16); border-radius:999px; padding:3px 9px; }
.swipecard .sc-play{ position:absolute; left:12px; top:12px; }
.swipecard .sc-play .play{ width:44px; height:44px; }
.stamp{ position:absolute; top:22px; padding:6px 12px; border:3px solid; border-radius:10px; font-weight:800; font-size:22px; letter-spacing:.04em; opacity:0; transform:rotate(-14deg); transition:opacity .1s; pointer-events:none; }
.stamp.love{ right:18px; color:#5ef0a0; border-color:#5ef0a0; }
.stamp.no{ left:18px; color:var(--accent); border-color:var(--accent); transform:rotate(14deg); }
.stamp.unk{ left:50%; top:auto; bottom:90px; transform:translateX(-50%); color:#9fc5ff; border-color:#9fc5ff; font-size:18px; }
.swipecard[data-hint="love"] .stamp.love,.swipecard[data-hint="no"] .stamp.no,.swipecard[data-hint="unk"] .stamp.unk{ opacity:1; }
.swipebtns{ display:flex; justify-content:center; gap:22px; margin-top:16px; }
.sbtn{ width:64px; height:64px; border-radius:50%; border:2px solid var(--line); background:var(--surface); font-size:26px; cursor:pointer; display:grid; place-items:center; transition:transform .1s; }
.sbtn:active{ transform:scale(.92); } .sbtn:disabled{ opacity:.35; }
.sbtn.no{ color:var(--accent); border-color:rgba(255,77,109,.5); }
.sbtn.love{ color:#5ef0a0; border-color:rgba(94,240,160,.5); width:72px; height:72px; font-size:30px; }
.sbtn.unk{ color:#9fc5ff; border-color:rgba(159,197,255,.5); width:52px; height:52px; font-size:20px; align-self:center; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i></i> Song Arena</div>
  <nav class="steps">
    <button class="step" data-step="setup">Decades</button>
    <button class="step" data-step="wall">Artists</button>
    <button class="step" data-step="discover">Songs</button>
    <button class="step" data-step="rank">Rank</button>
    <button class="step" data-step="list">List</button>
  </nav>
  <button class="ghost" id="installBtn" type="button" hidden>Install app</button>
  <button class="ghost" id="resetBtn" type="button">Start over</button>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>

  searching=false; save(); render(); }

/* ---------- Events ---------- */
document.addEventListener('input', e=>{ if(e.target.id==='ac') acInput(e.target.value); });
document.addEventListener('click', e=>{
  const st=e.target.closest('[data-step]'); if(st&&!st.disabled){ if(st.dataset.step==='wall') startWall(); else setStep(st.dataset.step); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const v=b.dataset.v;
  switch(b.dataset.act){
    case 'decade': { if(v==='all'){ S.decades=S.decades.length===DECADES.length?[]:DECADES.slice(); } else { const i=S.decades.indexOf(v); if(i>=0) S.decades.splice(i,1); else S.decades.push(v); } S.decades.sort((x,y)=>DECADES.indexOf(x)-DECADES.indexOf(y)); S.wall=null; S.wall2=null; S.wallPage=1; S.picks=[]; save(); render(); break; }
    case 'go-wall': if(S.decades.length) startWall(); break;
    case 'wall2': S.wallPage=2; S.wall2=null; save(); render(); window.scrollTo({top:0}); break;
    case 'wall1': S.wallPage=1; save(); render(); window.scrollTo({top:0}); break;
    case 'pick': { const i=S.picks.findIndex(p=>p.name===v); if(i>=0) S.picks.splice(i,1); else { const w=S.wall.find(a=>a.name===v)||(S.wall2||[]).find(a=>a.name===v); if(w) S.picks.push({name:w.name,tag:w.tag,dec:w.dec,id:w.id}); } initWeights(); save(); b.setAttribute('aria-pressed',String(i<0)); const pc=document.querySelector('.stat b'); if(pc) pc.textContent=S.picks.length; document.querySelectorAll('[data-act="wall2"]').forEach(x=>x.disabled=!S.picks.length); resolveNamed(); loadPools(); break; }
    case 'go-discover': startDiscover(); break;
    case 'ac-pick': { const id=+v, name=b.dataset.name; acRes=[]; acTerm=''; checkArtist(id,name); break; }
    case 'toggle': toggleLove(+v); break;
    case 'swipe': { if(swipeBusy) break; const el=document.getElementById('swipeTop'); if(el){ swipeBusy=true; flyOut(el,v); setTimeout(()=>{ swipeBusy=false; swipeDecide(v); },170); } else swipeDecide(v); break; }
    case 'ui': S.ui=v; save(); render(); break;
    case 'play': e.stopPropagation(); playPreview(+v); break;
    case 'next': nextScreen(); break;
    case 'more': moreFrom(+v); break;
    case 'search': doSearch(); break;
    case 'rank': { const was=S.target; S.target=+v; if(was!==S.target){ S.settledAt=null; S.stable=0; S.lastTop=null; } rebuildModel(); if(S.audited) setStep('rank'); else setStep('check'); break; }
    case 'check': setStep('check'); break;
    case 'go-rank': S.audited=true; S.checkArt=null; S.checkScreen=[]; rebuildModel(); setStep('rank'); break;
    case 'win': decide(+v); break;
    case 'skip': skipPair(); break;
    case 'step': setStep(v); break;
    case 'up': move(+v,-1); break;
    case 'down': move(+v,1); break;
    case 'resetManual': S.manual=null; save(); render(); break;
    case 'extend': S.target=50; S.manual=null; S.stable=0; S.lastTop=null; S.settledAt=null; S.audited=false; rebuildModel(); setStep('discover'); toast('Add more loves, then rank again'); break;
    case 'undo': undo(); break;
    case 'share': { const txt=exportText();
      if(navigator.share){ navigator.share({title:'My Top '+S.target+' songs',text:txt}).catch(()=>{}); }
      else if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Select the plain text below to copy')); }
      else toast('Select the plain text below to copy'); break; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){ if(e.key==='Enter'){ e.preventDefault(); if(e.target.id==='q') doSearch(); else if(e.target.id==='ac'&&acRes.length){ const a=acRes[0]; acRes=[]; acTerm=''; checkArtist(a.id,a.name); } } return; }
  const k=e.key.toLowerCase();
  if(S.step==='rank'){ if(!pairValid(current)) return; if(k==='arrowleft') decide(current[0]); else if(k==='arrowright') decide(current[1]); else if(k==='arrowdown') skipPair(); else if(k==='z') undo(); else return; e.preventDefault(); }
  else if(S.step==='discover'&&S.ui!=='grid'){ if(S.deckIdx>=S.screen.length){ if(k==='z') undo(); else if(k==='enter'||k==='arrowright') nextScreen(); else return; e.preventDefault(); return; } const kind=k==='arrowright'?'love':k==='arrowleft'?'no':k==='arrowdown'?'unk':null; if(kind){ const el=document.getElementById('swipeTop'); if(el&&!swipeBusy){ swipeBusy=true; flyOut(el,kind); setTimeout(()=>{ swipeBusy=false; swipeDecide(kind); },170); } } else if(k==='z') undo(); else return; e.preventDefault(); }
});
document.getElementById('resetBtn').addEventListener('click', ()=>{ if(confirm('Start over? This clears your answers, loves and rankings.')){ S=fresh(); undoStack=[]; current=null; searchRes=null; searchTerm=''; acRes=[]; acTerm=''; errorNote=null; audio.pause(); playingId=null; save(); render(); toast('Fresh start'); } });
render(); if(S.step==='discover'){ loadPools(); ensureCanon(); }
/* ---------- Installable app ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
let installEvt=null; const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; installBtn.hidden=false; });
installBtn.addEventListener('click', async()=>{ if(!installEvt) return; installEvt.prompt(); const r=await installEvt.userChoice.catch(()=>null); installEvt=null; installBtn.hidden=true; if(r&&r.outcome==='accepted') toast('Installed'); });
window.addEventListener('appinstalled', ()=>{ installBtn.hidden=true; });
</script>
